{% extends "base.html" %}{% block title %}Create account · CloudBus Pass{% endblock %}{% block content %}<section class="auth"><p class="eyebrow">GET STARTED</p><h1>Create your account</h1><p class="muted">Your bookings stay connected to your account.</p><form method="post" class="stack"><label>Full name<input name="name" required maxlength="100" autocomplete="name"></label><label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password"><small>At least 8 characters</small></label><button class="primary" type="submit">Create account</button></form><p class="muted center">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></section>{% endblock %}
